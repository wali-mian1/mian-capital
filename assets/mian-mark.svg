<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title">
  <title id="title">Mian Capital monogram</title>
  <defs>
    <radialGradient id="field" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(24 18) rotate(58) scale(52)">
      <stop stop-color="#2B6A4E"/>
      <stop offset="1" stop-color="#0F3427"/>
    </radialGradient>
    <linearGradient id="gold" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6E3A8"/>
      <stop offset=".55" stop-color="#D4AF66"/>
      <stop offset="1" stop-color="#A9823F"/>
    </linearGradient>
  </defs>
  <!-- seal -->
  <circle cx="32" cy="32" r="31" fill="url(#field)"/>
  <circle cx="32" cy="32" r="30.25" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26.5" stroke="url(#gold)" stroke-width=".6" opacity=".7"/>
  <!-- Didone M: hairline stems/strokes paired with heavy strokes -->
  <path d="M21.2 20.5V43.2" stroke="url(#gold)" stroke-width="1.4"/>
  <path d="M21.2 20.5L32 42.6" stroke="url(#gold)" stroke-width="4.2"/>
  <path d="M32 42.6L42.8 20.5" stroke="url(#gold)" stroke-width="1.4"/>
  <path d="M42.8 20.5V43.2" stroke="url(#gold)" stroke-width="4.2"/>
  <!-- serifs -->
  <path d="M17.6 20.5H23M40.8 20.5H46.2M17.8 43.4H24.6M39.4 43.4H46.6" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- small star above, a quiet nod to guidance -->
  <path d="M32 9.6L33 12.2L35.6 13.2L33 14.2L32 16.8L31 14.2L28.4 13.2L31 12.2Z" fill="#F1D891"/>
  <path d="M24 50.6H40" stroke="url(#gold)" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
</svg>
